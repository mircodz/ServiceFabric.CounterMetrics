name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'mircodz/ServiceFabric.CounterMetrics' && github.actor == 'mircodz'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    if: github.repository == 'mircodz/ServiceFabric.CounterMetrics' && github.actor == 'mircodz'
    environment: publish
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      OUT_DIR: artifacts/nupkg
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and ensure a new release
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Run the Release workflow from main."
          }
          $version = (Get-Content version -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "The version file must use numeric X.Y.Z format."
          }
          $tags = @(git tag --list)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read existing release tags."
          }
          if ($tags -ccontains $version -or $tags -ccontains "v$version") {
            throw "Version $version is already tagged. Bump the version file."
          }
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download packages built by CI
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: ${{ env.OUT_DIR }}

      - name: Ensure packages match the release version
        id: packages
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          foreach ($extension in @('nupkg', 'snupkg')) {
            $package = Join-Path $env:OUT_DIR "ServiceFabric.CounterMetrics.$env:PACKAGE_VERSION.$extension"
            if (!(Test-Path -LiteralPath $package -PathType Leaf)) {
              throw "Expected package not found: $package"
            }
            $resolvedPath = (Resolve-Path -LiteralPath $package).Path
            "$extension=$resolvedPath" >> $env:GITHUB_OUTPUT
          }

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          PACKAGE_PATH: ${{ steps.packages.outputs.nupkg }}
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "$env:PACKAGE_PATH"
          --source https://api.nuget.org/v3/index.json
          --api-key "$env:NUGET_API_KEY"
          --skip-duplicate

      - name: Push to GitHub Packages
        env:
          PACKAGE_PATH: ${{ steps.packages.outputs.nupkg }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push "$env:PACKAGE_PATH"
          --source "https://nuget.pkg.github.com/$env:OWNER/index.json"
          --api-key "$env:GITHUB_TOKEN"
          --no-symbols
          --skip-duplicate

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.version.outputs.VERSION }}
          PACKAGE_PATH: ${{ steps.packages.outputs.nupkg }}
          SYMBOL_PACKAGE_PATH: ${{ steps.packages.outputs.snupkg }}
        run: |
          gh release create "$env:PACKAGE_VERSION" "$env:PACKAGE_PATH" "$env:SYMBOL_PACKAGE_PATH" `
            --target "$env:GITHUB_SHA" `
            --title "ServiceFabric.CounterMetrics $env:PACKAGE_VERSION" `
            --generate-notes
